benchmark: DrugBank
regime: pairwise-random
notes: EviDTI-style fixed pairwise-random protocol; graph/KGE inputs are unavailable in this release template.
model:
  use_hca: true
  use_graph_context: false
  use_kge_refinement: false
train:
  seed: 1
  batch_size: 64
  epochs: 60
  learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip_norm: 1.0
  selection_metric: auprc

