benchmark: synthetic
regime: pairwise-random
notes: Tiny CPU smoke configuration; not a paper benchmark configuration.
model:
  smiles_input_dim: 12
  text_input_dim: 12
  protein_input_dim: 20
  projection_dim: 16
  projector_hidden_dim: 24
  projector_mid_dim: 16
  projector_dropout: 0.0
  pair_hidden_dim: 24
  pair_mid_dim: 12
  pair_dropout: 0.0
  use_hca: true
  hca_num_heads: 4
  hca_hidden_dim: 24
  hca_dropout: 0.0
  use_graph_context: true
  graph_context_dim: 2
  use_kge_refinement: true
  kge_hidden_dim: 16
  kge_dropout: 0.0
  kge_initial_scale: 0.1
  kge_residual_shrink: 0.2
  kge_residual_bound: 0.75
  confidence_margin_bias: 1.0
  confidence_margin_temperature: 1.0
train:
  seed: 7
  batch_size: 16
  epochs: 3
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 1.0
  selection_metric: auprc

